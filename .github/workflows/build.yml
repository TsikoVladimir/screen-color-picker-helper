name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build helper
        shell: powershell
        run: .\build.ps1
      - name: Upload unsigned helper
        uses: actions/upload-artifact@v4
        with:
          name: screen-color-picker-helper-unsigned
          path: dist/screen-color-picker-helper.exe
