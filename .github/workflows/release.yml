name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
      - name: Build and test helper
        shell: powershell
        run: .\test.ps1 -SkipInteractiveCheck
      - name: Write checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath .\dist\screen-color-picker-helper.exe).Hash.ToLowerInvariant()
          "$hash  screen-color-picker-helper.exe" | Set-Content -Encoding ascii -LiteralPath .\dist\SHA256SUMS.txt
      - name: Upload unsigned build artifact
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screen-color-picker-helper-${{ github.ref_name }}-unsigned
          path: dist/screen-color-picker-helper.exe
          if-no-files-found: error
      - name: Publish unsigned release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Automated build from the tagged source in this repository.

          This release is unsigned while the SignPath Foundation application is pending.

          ## Code signing policy

          Free code signing provided by SignPath.io, certificate by SignPath Foundation.
          See the repository README for roles, privacy, and release policy.
          "@
          gh release create $env:GITHUB_REF_NAME `
            .\dist\screen-color-picker-helper.exe `
            .\dist\SHA256SUMS.txt `
            --verify-tag `
            --title "Screen Color Picker Helper $env:GITHUB_REF_NAME" `
            --notes $notes
